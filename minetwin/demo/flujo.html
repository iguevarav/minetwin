<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineTwin · Un camión en la cola del taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --ink:#16181D; --muted:#61656E; --faint:#A3A6AD;
  --line:#E4E2DB; --track:#ECEAE3;
  --accent:#D8961A; --accent-ink:#8A5B00; --accent-soft:#FBF0D9;
  --cool:#5B72D6; --cool-soft:#E8ECFA;
  --s1:#16181D; --s2:#D8961A; --s3:#5B72D6;
  --radius:16px; --gutter:32px;
}
:root[data-theme="dark"]{
  --bg:#111215; --surface:#1A1C21; --ink:#ECEDEF; --muted:#9DA1AA; --faint:#5E626B;
  --line:#2A2D34; --track:#24272D;
  --accent:#E3A532; --accent-ink:#F2C26A; --accent-soft:#2E2512;
  --cool:#8C9DF0; --cool-soft:#1C2238;
  --s1:#ECEDEF; --s2:#E3A532; --s3:#8C9DF0;
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
strong,b{font-weight:600}
.frame{width:100%;max-width:1304px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}

/* Encabezado */
header.top{display:flex;align-items:center;gap:20px;padding-top:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent)}
.brand b{color:var(--accent);font-weight:600}
.spacer{flex:1}
.sections{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec-btn{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer;color:var(--muted);transition:border-color .4s,color .4s}
.sec-btn .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--track);font-size:13px}
.sec-btn.on{color:var(--ink);border-color:var(--ink)}
.sec-btn.on .k{background:var(--ink);color:var(--bg)}
.sec-div{width:1px;height:22px;background:var(--line);margin:0 4px}
.controls{display:flex;gap:6px}
.icon-btn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:15px}
.icon-btn:hover{border-color:var(--faint)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:0 16px;font-weight:500}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Etapas */
.strip{display:flex;align-items:stretch;margin-top:30px}
.station{flex:1;display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;transition:border-color .8s,background .8s,opacity .8s}
.strip.few .station{flex:0 1 300px}
.station .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--track);color:var(--muted);transition:background .8s,color .8s}
.station .tx{min-width:0}
.station .nm{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station .sm{display:block;font-size:13.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station.todo{opacity:.5;cursor:default}
.station.now{border-color:var(--accent);background:var(--accent-soft)}
.station.now .nm{font-weight:600}
.station.now .n{background:var(--accent);color:#fff}
.station.done .n{background:var(--ink);color:var(--bg)}
.conn{flex:none;width:18px;align-self:center;height:1px;background:var(--line);margin:0 3px;transition:background .8s}
.conn.live{background:var(--faint)}

/* Contenido */
main{flex:1;padding-top:44px;padding-bottom:24px}
:root{--stage:min(calc(100vh - 300px), 390px)}
.scene{animation:enter .9s cubic-bezier(.25,.6,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.title{font-size:clamp(26px,2.5vw,32px);line-height:1.2;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;min-width:0;min-height:0;display:flex;flex-direction:column}
.card.center>.label+*,.card.center>:first-child:not(.label){margin-top:auto}
.card.center>:last-child{margin-bottom:auto}
.grow{flex:1 1 auto}
.label{font-size:14.5px;color:var(--muted);margin-bottom:12px}
.body{display:grid;gap:18px;margin-top:22px;min-height:var(--stage)}
.g-truck{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-data{grid-template-columns:minmax(0,2.3fr) minmax(0,1fr)}
.g-proc{grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr) minmax(0,1fr)}
.g-res{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-con{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.g-fleet{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.g-ctx{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:980px){.g-truck,.g-data,.g-proc,.g-res,.g-con,.g-fleet,.g-ctx{grid-template-columns:1fr}.strip{flex-wrap:wrap;gap:6px}.conn{display:none}.station,.strip.few .station{flex:1 1 150px}header.top{flex-wrap:wrap}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.note{font-size:15px;color:var(--muted);margin-top:12px;line-height:1.45}
.fade{opacity:0;animation:enter .9s forwards}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.big{font-size:clamp(32px,3vw,40px);font-weight:600;line-height:1.1}
.big small{font-size:.48em;color:var(--muted);font-weight:400}

/* 1 · Camión */
.truck-card{display:flex;align-items:center;justify-content:center;padding:28px 22px}
.truck-svg{width:100%;height:auto;display:block}
.truck-svg .ol{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.truck-svg .olf{fill:var(--surface);stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.truck-svg .ground{stroke:var(--line);stroke-width:2}
.truck-svg .tid{font-size:40px;font-weight:600;fill:var(--ink)}
.truck-svg .tsub{font-size:15px;fill:var(--muted)}
.truck-svg .sdot-o{fill:var(--surface)}
.truck-svg .ring{fill:none;stroke-width:1.5;opacity:0;animation:ring 4s ease-out infinite}
@keyframes ring{0%{r:8;opacity:.6}100%{r:20;opacity:0}}
.truck-svg .pill{fill:var(--track)}
.truck-svg .slab{font-size:13px;font-weight:500}

/* 2 · Datos */
.tbl-wrap{flex:1 1 0;min-height:0;overflow:auto;border-radius:10px;scroll-behavior:smooth}
table.raw{width:100%;border-collapse:collapse;font-size:15.5px;font-variant-numeric:tabular-nums}
table.raw th{position:sticky;top:0;background:var(--surface);text-align:right;font-size:13.5px;color:var(--muted);font-weight:400;padding:8px 12px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
table.raw th:first-child,table.raw td:first-child{text-align:left}
table.raw td{text-align:right;padding:6px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.raw tr.new td{animation:rowin 1.4s ease-out}
@keyframes rowin{from{opacity:0}to{opacity:1}}
table.raw td.miss{color:var(--faint)}
svg.perf{width:54px;height:20px;vertical-align:middle}
svg.perf rect{fill:var(--faint)} svg.perf rect.hi{fill:var(--accent)}
.legend-list{display:flex;flex-direction:column;gap:14px;font-size:15.5px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.legend-list span{color:var(--muted)}
.bar-mini{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:12px}
.bar-mini div{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .6s}

/* 3 · Procesamiento */
.sub{transition:opacity .6s,border-color .6s}
.sub .content{flex:1;display:flex;flex-direction:column;justify-content:center}
.sub.ghost{opacity:.4}
.sub.ghost .content{visibility:hidden}
.sub.active{border-color:var(--accent)}
.sub .label{display:flex;align-items:center;gap:8px}
.sub .tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--track);font-size:12.5px;color:var(--muted)}
.sub.active .tag{background:var(--accent);color:#fff}
.sub.past .tag{background:var(--ink);color:var(--bg)}
svg.timeline{width:100%;height:auto;display:block;margin-top:8px}
.tl-dot{fill:var(--faint);transition:fill .8s}
.tl-dot.in{fill:var(--ink)}
.tl-band{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4}
.tl-fut{fill:url(#hatch)}
.tl-t{font-size:12.5px;fill:var(--muted)}
.tl-now{stroke:var(--ink);stroke-width:1.5}
table.feat{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.feat th{text-align:right;font-size:13px;color:var(--muted);font-weight:400;padding:4px 6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.feat td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.feat th:first-child,table.feat td:first-child{text-align:left}
table.feat tr{opacity:0;animation:enter .9s forwards}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:15px;color:var(--muted)}
.eq b{display:inline-block;padding:5px 10px;border-radius:10px;background:var(--track);color:var(--ink);font-size:17px;font-weight:500}
.eq b.total{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.eq span{opacity:0;animation:enter .9s forwards}
svg.net{width:100%;height:auto;display:block}
.net .edge{stroke:var(--line);stroke-width:1;opacity:.6;transition:stroke 1.6s,opacity 1.6s}
.net .edge.flow{stroke:var(--accent);opacity:.35}
.net .in{fill:var(--track)}
.net .hid{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.net .out{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.net .out.hot{stroke:var(--accent);fill:var(--accent-soft)}
.net .ot{font-size:12.5px;fill:var(--muted)}
.net .ov{font-size:13.5px;fill:var(--ink);font-weight:500;transition:opacity 1.2s}
.net .cap{font-size:12px;fill:var(--faint)}
.trust{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--cool-soft);font-size:14.5px;line-height:1.45}

/* 4 · Resultado */
.bars{display:flex;flex-direction:column;gap:15px}
.bar-row{display:grid;grid-template-columns:minmax(130px,210px) 1fr 52px;gap:14px;align-items:center}
.bar-label{font-size:15.5px;line-height:1.3}
.bar-track{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;width:0;background:var(--faint);border-radius:6px;transition:width 1.8s cubic-bezier(.25,.6,.3,1)}
.bar-row.hot .bar-fill{background:var(--accent)}
.bar-row.hot .bar-label,.bar-row.hot .bar-val{font-weight:600}
.bar-val{text-align:right;font-size:16.5px}
svg.ruler{width:100%;height:auto;display:block;margin-top:18px}
.ruler .bin{fill:var(--faint)} .ruler .bin.cap{fill:var(--accent)}
.ruler .capzone{fill:var(--accent-soft)}
.ruler .ax{font-size:12.5px;fill:var(--muted)}
.ruler .mk{fill:var(--ink)}
.ruler .mkl{font-size:13.5px;fill:var(--ink);font-weight:500}
.ruler .capl{font-size:12.5px;fill:var(--accent-ink)}

/* 5 · Conclusión */
.decision{border-left:5px solid var(--accent)}
.decision.wait{border-left-color:var(--cool)}
.decision .verdict{font-size:clamp(27px,2.6vw,34px);font-weight:600;line-height:1.15}
.decision .why-sub{color:var(--muted);margin-top:6px;font-size:16px}
.gauge{position:relative;height:12px;background:var(--track);border-radius:6px;margin:36px 0 38px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--accent);transition:width 1.8s cubic-bezier(.25,.6,.3,1)}
.gauge .fill.low{background:var(--cool)}
.gauge .thr{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink)}
.gauge .lab{position:absolute;font-size:14px;white-space:nowrap;transform:translateX(-50%)}
.gauge .lab.top{bottom:22px;font-weight:600} .gauge .lab.bot{top:22px;color:var(--muted)}
.limit{font-size:15.5px;padding-top:14px;border-top:1px solid var(--line)}
.squares{display:grid;grid-template-columns:repeat(20,1fr);gap:5px}
.squares i{display:block;aspect-ratio:1;border-radius:3px;background:var(--track);opacity:0;animation:enter .8s forwards}
.squares i.cap{background:var(--accent)}
.squares i.me{background:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sq-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:16px}
.sq-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Flota */
.icons{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:420px}
.icons i{display:block;aspect-ratio:1.3;border-radius:5px;background:var(--track);opacity:0;animation:enter .8s forwards}
.icons i.hit{background:var(--accent)}
.icons i.hit.cool{background:var(--faint)}
.vs{display:flex;flex-direction:column;gap:26px}
.vs p{font-size:16.5px;margin-bottom:10px;color:var(--muted)}
.vs p b{font-size:24px;color:var(--ink)}
table.k{width:100%;border-collapse:collapse;font-size:16.5px;font-variant-numeric:tabular-nums}
table.k th{font-size:13.5px;color:var(--muted);font-weight:400;text-align:right;padding:6px 10px 10px;border-bottom:1px solid var(--line)}
table.k th:first-child,table.k td:first-child{text-align:left}
table.k td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}
table.k tr.sel td{background:var(--accent-soft);font-weight:600}
table.k tbody tr{opacity:0;animation:enter .9s forwards}
.cmp{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cmp .r{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;font-size:14.5px;color:var(--muted)}
.cmp .t{grid-column:1/-1;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.cmp .f{height:100%;width:0;border-radius:5px;background:var(--faint);transition:width 1.8s cubic-bezier(.25,.6,.3,1)}
.cmp .f.a{background:var(--accent)}
.cmp b{font-weight:500;text-align:right;color:var(--ink)}
svg.fed{width:100%;height:auto;max-height:290px;display:block;margin:2px auto 0}
.fed .flink{fill:none;stroke:var(--line);stroke-width:2}
.fed .fup{fill:var(--accent)} .fed .fdown{fill:var(--cool)}
.fed .fcoord{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fed .fct{font-size:18px;font-weight:600;fill:var(--ink)}
.fed .fcs{font-size:13.5px;fill:var(--accent-ink)}
.fed .fnode{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fed .fnt{font-size:16px;font-weight:500;fill:var(--ink)}
.fed .fns{font-size:13px;fill:var(--muted)}
.fed .flock{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fed-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.fed-foot .lg{display:flex;gap:18px}
.fed-foot i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.fed-foot i.up{background:var(--accent)} .fed-foot i.down{background:var(--cool)}
.hero{font-size:clamp(46px,4.4vw,58px);font-weight:600;line-height:1;color:var(--accent-ink)}
.hero small{font-size:.32em;color:var(--muted);font-weight:400;margin-left:8px}
.hero-sub{color:var(--muted);margin-top:8px;font-size:15px}
.card.dark{background:var(--ink);border-color:var(--ink)}
.card.dark .label,.card.dark .hero-sub{color:color-mix(in srgb,var(--bg) 68%,transparent)}
.card.dark .hero{color:var(--accent)}
.g-ctx2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.lim-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.lim-item{display:flex;gap:12px;align-items:flex-start;opacity:0;animation:enter .9s forwards}
.lim-item .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--track);display:grid;place-items:center;color:var(--ink)}
.lim-item .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lim-item b{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
.lim-item span{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
@media (max-width:980px){.g-ctx2{grid-template-columns:1fr}.lim-grid{grid-template-columns:1fr 1fr}}
@media (max-height:800px) and (min-width:981px){svg.fed{max-height:250px}.hero{font-size:46px}}

/* ---- Vistas dinámicas ---- */
.card.mid{justify-content:center}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drive{0%{transform:translateX(-70px);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}50%{box-shadow:0 0 0 2px var(--surface),0 0 0 8px color-mix(in srgb,var(--ink) 25%,transparent)}}
/* camión */
.truck-move{width:100%;animation:drive 1.8s cubic-bezier(.2,.7,.2,1) both}
.truck-svg .sensor{opacity:0;animation:popin .8s cubic-bezier(.3,.7,.2,1.2) forwards;transform-box:fill-box;transform-origin:50% 100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:14px;min-width:0}
.tile{justify-content:center;padding:18px 20px;opacity:0;animation:enter .9s forwards}
.tile .label{margin-bottom:6px}
.tile .tv{font-size:clamp(26px,2.5vw,32px);font-weight:600;line-height:1.1}
.tile .tv.sm{font-size:clamp(21px,2vw,25px)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 20px}
.tile.wide .label{margin:0}
/* resultado */
.bar-row.hot{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0 -12px}
.ruler .bin{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s cubic-bezier(.25,.6,.3,1) both}
.place-sub{color:var(--muted);font-size:15px;margin-top:4px}
/* conclusión */
.verdict-card{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.verdict-card .verdict{font-size:clamp(27px,2.6vw,34px);font-weight:600;line-height:1.15;margin-top:12px}
.verdict-card .why-sub{color:color-mix(in srgb,var(--bg) 68%,transparent);margin-top:6px;font-size:16px}
.status{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:5px 12px;border-radius:999px;font-size:14px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.wait{background:color-mix(in srgb,var(--cool) 25%,transparent);color:var(--cool)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .label{margin-bottom:4px}
.duo .v{font-size:clamp(34px,3.2vw,42px);font-weight:600;line-height:1}
.duo .v.acc{color:var(--accent-ink)} .duo .v.low{color:var(--cool)}
.gauge2{position:relative;height:12px;background:var(--track);border-radius:6px;margin:22px 0 18px}
.gauge2 .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--accent);transition:width 1.8s cubic-bezier(.25,.6,.3,1)}
.gauge2 .fill.low{background:var(--cool)}
.gauge2 .thr{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink);opacity:0;transition:opacity .8s}
.squares i.me{animation:enter .8s forwards,pulse 2.6s ease-in-out 1.8s infinite}
/* flota */
.tgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;max-width:440px}
@media (max-height:800px) and (min-width:981px){.kb{padding:6px 12px}.kb-r{line-height:1.3}.vs-rand{margin:16px 0 8px}}
.tgrid i{display:block;opacity:0;animation:popin .6s cubic-bezier(.3,.7,.2,1.2) forwards;color:color-mix(in srgb,var(--bg) 22%,transparent)}
.tgrid i svg{width:100%;height:auto;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tgrid i.on{color:var(--accent)}
.tgrid.rand i.on{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.vs-rand{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;color:color-mix(in srgb,var(--bg) 68%,transparent);font-size:15.5px}
.vs-rand b{font-size:22px;font-weight:600;color:var(--bg)}
.dark .hero small{color:color-mix(in srgb,var(--bg) 68%,transparent)}
.kbars{display:flex;flex-direction:column;gap:6px}
.kb{padding:8px 12px;border-radius:12px;opacity:0;animation:enter .9s forwards}
.kb.sel{background:var(--accent-soft)}
.kb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:15px;color:var(--muted)}
.kb-h b{color:var(--ink);font-weight:600;font-size:16.5px}
.pill{padding:2px 10px;border-radius:999px;background:var(--track);color:var(--ink);font-size:14px;font-weight:500}
.kb.sel .pill{background:var(--accent);color:#fff}
.kb-r{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:2px}
.kb-t{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.kb.sel .kb-t{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.kb-f{height:100%;width:0;border-radius:4px;background:var(--faint);transition:width 1.6s cubic-bezier(.25,.6,.3,1)}
.kb-f.a{background:var(--accent)}
.kb-v{text-align:right;color:var(--ink);font-size:14.5px}

  .bars{gap:11px}

  .gauge{margin:32px 0 34px}
  .truck-card{padding:18px}
  .vs{gap:18px}
  table.k td{padding:8px 10px}
}

  if(!D.flota || !Array.isArray(D.flota.capacidades) || !D.flota.capacidades.length) e.push('flota.capacidades falta.');
  else if(!D.flota.capacidades.some(c=>c.revisiones===D.capacidad)) e.push('flota.capacidades debe incluir la capacidad publicada.');
  if(!Array.isArray(D.camiones) || !D.camiones.length){ e.push('camiones debe tener al menos un camión.'); return e; }
  const claves = (D.sensores||[]).filter(s=>s.clave!=='perfil').map(s=>s.clave);
  D.camiones.forEach((c,i)=>{
    const p = `camiones[${i}]`, L = Array.isArray(c.lecturas) ? c.lecturas.length : 0;
    if(c.id==null) e.push(`${p}.id falta.`);
    if(L < 2) e.push(`${p}.lecturas necesita al menos 2 reportes.`);
    else c.lecturas.forEach((r,j)=>{
      if(!num(r.t)) e.push(`${p}.lecturas[${j}].t debe ser un número.`);
      if(j && r.t < c.lecturas[j-1].t) e.push(`${p}.lecturas no está ordenada por t (índice ${j}).`);
      claves.forEach(k=>{ if(!(r.valores && (r.valores[k]===null || num(r.valores[k])))) e.push(`${p}.lecturas[${j}].valores.${k} debe ser número o null.`); });

    const q = c.probabilidades;

    if(!Number.isInteger(c.total_grupo) || c.total_grupo < 1) e.push(`${p}.total_grupo debe ser un entero.`);
    if(!(Number.isInteger(c.puesto) && c.puesto>=1 && c.puesto<=(c.total_grupo||Infinity))) e.push(`${p}.puesto debe estar entre 1 y total_grupo.`);
    if(typeof c.prioritario!=='boolean') e.push(`${p}.prioritario debe ser true o false.`);

/* ---------- 3 · Procesamiento ---------- */
function vistaProceso(el, ctx, sub){

  const col = (i, tt) => `<div class="card sub ${i<sub?'past':i===sub?'active':'ghost'}" id="sub${i}"><p class="label"><span class="tag">${i+1}</span>${tt}</p><div class="content"></div></div>`;
  el.innerHTML = titulo(t[sub]) + `<div class="body g-proc">${col(0,'Mira lo reciente')}${col(1,'Resume')}${col(2,'Estima')}</div>`;
  const cont = i => el.querySelector(`#sub${i} .content`);
  pintarVentana(cont(0), ctx, sub===0);
  if(sub>=1) pintarResumen(cont(1), sub===1);

}
function pintarVentana(box, ctx, anim){
  const c = camion(), rows = c.lecturas, a = c.ventana.inicio, b = c.ventana.fin;
  const W=320, H=150, pl=12, pr=58, t0 = rows[0].t, tMax = rows[rows.length-1].t, span = (tMax-t0) || 1;
  const x = t => pl + ((t-t0)/span)*(W-pl-pr);
  const svg = sv('svg', {viewBox:`0 0 ${W} ${H}`, class:'timeline', role:'img', 'aria-label':'Reportes que usa el sistema'}, box);
  svg.innerHTML = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--line')}" stroke-width="3"/></pattern></defs>`;
  sv('rect', {class:'tl-fut', x:x(tMax)+8, y:28, width:W-x(tMax)-12, height:56, rx:8}, svg);
  sv('text', {class:'tl-t', x:(x(tMax)+W)/2+2, y:106, 'text-anchor':'middle'}, svg).textContent = 'futuro';
  const x0 = x(rows[a].t)-8, x1 = x(rows[b].t)+6;
  const band = sv('rect', {class:'tl-band', x:x1, y:34, width:0, height:44, rx:8}, svg);
  sv('line', {class:'tl-now', x1:x(tMax), x2:x(tMax), y1:22, y2:92}, svg);
  sv('text', {class:'tl-t', x:x(tMax), y:16, 'text-anchor':'middle'}, svg).textContent = 'hoy';
  const dots = rows.map(r => sv('circle', {class:'tl-dot', cx:x(r.t), cy:56, r:rows.length>30?3:4.5}, svg));
  sv('text', {class:'tl-t', x:pl, y:128}, svg).textContent = `Reporte ${fmtInt(rows[0].n ?? 1)}`;
  const lab = sv('text', {class:'tl-t', x:(x0+x1)/2, y:128, 'text-anchor':'middle', opacity:0}, svg);
  lab.textContent = `Usa ${fmtInt(rows[a].n ?? a+1)}–${fmtInt(rows[b].n ?? b+1)}`;
  const enV = i => i>=a && i<=b;
  const fin = () => { band.setAttribute('x', x0); band.setAttribute('width', x1-x0); dots.forEach((d,i)=>d.classList.toggle('in', enV(i))); lab.setAttribute('opacity',1); };
  if(!anim){ fin(); return; }
  ctx.after(600, ()=>{ const st=performance.now(); ctx.raf(t=>{ const p=Math.min(1,(t-st)/2000), e=1-Math.pow(1-p,3), xl=x1-(x1-x0)*e; band.setAttribute('x',xl); band.setAttribute('width',x1-xl); dots.forEach((d,i)=>d.classList.toggle('in', enV(i) && x(rows[i].t)>=xl)); if(p>=1){ fin(); return false; } }); });
}
function fmtStat(clave, v){
  if(v==null || !isFinite(v)) return '—';
  if(/falt|miss|ausen/i.test(clave)) return fmtPct(v*100,0);
  return compact(v);
}

function pintarModelo(box, ctx, anim){

function regla(box, ctx){
  const c = camion(), bins = c.fila, B = bins.length, n = c.total_grupo, K = CAP();
  const W=520, H=150, pl=8, pr=8, top=26, base=96, mx = Math.sqrt(Math.max(...bins)) || 1, bw = (W-pl-pr)/B;
  const xr = r => pl + (r-1)/n*(W-pl-pr);
  const svg = sv('svg', {viewBox:`0 0 ${W} ${H}`, class:'ruler', role:'img', 'aria-label':`Puesto ${c.puesto} de ${n}`}, box);
  sv('rect', {class:'capzone', x:pl, y:top-8, width:Math.max(6, xr(K)-pl), height:base-top+8, rx:3}, svg);
  bins.forEach((v,b)=>{ const h=Math.max(1.5,(base-top)*Math.sqrt(Math.max(v,0))/mx); sv('rect', {class:'bin'+(b===0||b/B < K/n ? ' cap':''), x:pl+b*bw+0.5, y:base-h, width:Math.max(1,bw-1), height:h, style:`animation-delay:${.3+b*.008}s`}, svg); });
  sv('text', {class:'capl', x:Math.max(6, xr(K)-pl)+pl+6, y:top+2}, svg).textContent = `← el taller revisa los ${fmtInt(K)} primeros`;
  sv('text', {class:'ax', x:pl, y:base+18}, svg).textContent = 'Más urgente';
  sv('text', {class:'ax', x:W-pr, y:base+18, 'text-anchor':'end'}, svg).textContent = 'Menos urgente';
  const g = sv('g', {}, svg);
  sv('path', {class:'mk', d:'M0 0 L-7 11 L7 11 Z'}, g);
  const lbl = sv('text', {class:'mkl num', y:30}, g);
  lbl.textContent = `Camión ${c.id}`;
  const target = xr(c.puesto), anchor = target < 60 ? 'start' : target > W-60 ? 'end' : 'middle';
  lbl.setAttribute('text-anchor', anchor); lbl.setAttribute('x', anchor==='start'?-8:anchor==='end'?8:0);
  const place = x => g.setAttribute('transform', `translate(${x},${base+22})`);
  place(W-pr);
  ctx.after(1600, ()=>{ const st=performance.now(); ctx.raf(t=>{ const q=Math.min(1,(t-st)/2400), e=1-Math.pow(1-q,3); place((W-pr)+(target-(W-pr))*e); return q<1; }); });
}

  </div>`;
  contar(ctx, el.querySelector('#enc'), 0, enc, 1400, 500, v=>fmtInt(v));
  el.querySelectorAll('.kb-f').forEach((b,i)=> ctx.after(600+Math.floor(i/2)*220+(i%2)*120, ()=> b.style.width = b.dataset.w+'%'));
}

/* ---------- Toda la flota · Aprender sin compartir datos ---------- */
function vistaContexto(el, ctx){
  const f = D.federacion, red = (1 - f.mb_compartidos/f.mb_centralizado)*100;
  const nodos = (Array.isArray(f.nodos) && f.nodos.length===3) ? f.nodos : ['Alpha','Beta','Gamma'];
  const cx = [110, 300, 490];
  const lims = [
    ['M5 21 9 3M19 21 15 3M12 5v2M12 11v2M12 17v2', 'Camiones de carretera', 'No de minería.'],
    ['M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4M12 17.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0', 'Sensores anónimos', 'No sabemos qué mide cada uno.'],
    ['M8.5 17h7M8 15.5 10.8 8M16 15.5 13.2 8M8.5 17a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0M20.5 17a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0M14.5 6a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0', 'Nodos simulados', 'Divisiones de un mismo registro.'],
    ['M5 21V4M5 4h11l-2 4 2 4H5', 'Prioriza, no diagnostica', 'No confirma fallas.']
  ];
  el.innerHTML = titulo('Aprender sin compartir datos') + `
  <div class="body g-ctx2">
    <div class="card center">
      <p class="label">Tres nodos entrenan un modelo común</p>
      <svg class="fed" viewBox="0 0 600 250" role="img" aria-label="Tres nodos envían lo aprendido a un modelo común">
        <defs>${cx.map((x,i)=>`<path id="fp${i}" d="M ${x} 168 C ${x} 128, 300 128, 300 86"/>`).join('')}</defs>
        ${cx.map((x,i)=>`<use href="#fp${i}" class="flink"/>
          <circle r="5" class="fup"><animateMotion dur="4.5s" begin="${i*0.6}s" repeatCount="indefinite"><mpath href="#fp${i}"/></animateMotion></circle>
          <circle r="5" class="fdown"><animateMotion dur="4.5s" begin="${2.25+i*0.6}s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#fp${i}"/></animateMotion></circle>`).join('')}
        <rect class="fcoord" x="195" y="16" width="210" height="70" rx="16"/>
        <text class="fct" x="300" y="46" text-anchor="middle">Modelo común</text>
        <text class="fcs" x="300" y="68" text-anchor="middle">combina lo aprendido</text>
        ${nodos.map((n,i)=>`<g transform="translate(${cx[i]-86},168)">
          <rect class="fnode" width="172" height="72" rx="14"/>
          <text class="fnt" x="86" y="30" text-anchor="middle">Nodo ${esc(n)}</text>
          <g class="flock" transform="translate(30,42)"><rect x="0" y="6" width="13" height="10" rx="2.5"/><path d="M3 6V4.5a3.5 3.5 0 0 1 7 0V6"/></g>
          <text class="fns" x="51" y="56">reportes privados</text>
        </g>`).join('')}
      </svg>
      <div class="fed-foot"><div class="lg"><span><i class="up"></i>Lo aprendido sube</span><span><i class="down"></i>El modelo común vuelve</span></div><span>Nodos: divisiones del mismo registro</span></div>
    </div>
    <div class="stack">
      <div class="card center dark"><p class="label">Reportes compartidos</p><p class="hero num">${fmtInt(f.reportes_enviados)}</p><p class="hero-sub">Ningún reporte salió de su nodo.</p></div>
      <div class="card center grow"><p class="label">Datos enviados</p><p class="hero num"><span id="red">0</span>&nbsp;%<small>menos</small></p>
        <div class="cmp">
          <div class="r"><span>Compartiendo lo aprendido</span><b class="num">${fmtDec(f.mb_compartidos,2)} MB</b><div class="t"><div class="f a" data-w="${f.mb_compartidos/f.mb_centralizado*100}"></div></div></div>
          <div class="r"><span>Juntando todos los datos</span><b class="num">${fmtDec(f.mb_centralizado,1)} MB</b><div class="t"><div class="f" data-w="100"></div></div></div>
        </div>
      </div>
    </div>
    <div class="card" style="grid-column:1/-1">
      <p class="label">Lo que aún no sabemos</p>
      <div class="lim-grid">${lims.map((l,i)=>`<div class="lim-item" style="animation-delay:${.4+i*.2}s"><span class="ic"><svg viewBox="0 0 24 24"><path d="${l[0]}"/></svg></span><div><b>${l[1]}</b><span>${l[2]}</span></div></div>`).join('')}</div>
    </div>
  </div>`;
  el.querySelectorAll('.cmp .f').forEach((b,i)=> ctx.after(700+i*400, ()=> b.style.width = b.dataset.w+'%'));
  const objetivo = Math.round(red), nodo = el.querySelector('#red');
  ctx.after(500, ()=>{ const st = performance.now(); ctx.raf(t=>{ const q = Math.min(1,(t-st)/1600), e = 1-Math.pow(1-q,3); nodo.textContent = Math.round(objetivo*e); return q<1; }); });
}

/* ---------- Arranque ---------- */
if(ERRORES.length){
  strip.hidden = true; document.querySelector('.controls').hidden = true;
  panel.innerHTML = `<div class="card" style="border-color:var(--accent)"><p class="label">El payload no es válido</p><ul style="margin:6px 0 0 20px;line-height:1.6">${ERRORES.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  console.error('MineTwin · payload inválido', ERRORES);
} else {
  document.getElementById('prev').onclick = retroceder;
  document.getElementById('next').onclick = avanzar;
  document.getElementById('reset').onclick = ()=> irSeccion(sec);
  document.getElementById('auto').onclick = ()=> setAuto(!auto);
  document.getElementById('sections').addEventListener('click', e=>{ const b=e.target.closest('[data-sec]'); if(b) irSeccion(+b.dataset.sec); });
  strip.addEventListener('click', e=>{
    const b = e.target.closest('[data-e]'); if(!b) return;
    const et = +b.dataset.e; if(et > pasos()[paso].e) return;
    let k = pasos().length-1; while(pasos()[k].e !== et) k--;
    paso = k; render();
  });
  document.addEventListener('keydown', e=>{
    const k = e.key;
    if(k==='ArrowRight' || k==='PageDown'){ e.preventDefault(); avanzar(); }
    else if(k==='ArrowLeft' || k==='PageUp'){ e.preventDefault(); retroceder(); }
    else if(k===' '){ e.preventDefault(); setAuto(!auto); }
    else if(k==='r' || k==='R'){ irSeccion(sec); }
    else if(k==='t' || k==='T'){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; render(); }
    else if(/^[1-9]$/.test(k) && +k <= SECCIONES.length){ irSeccion(+k-1); }
  });
  render();
}
</script>
</body>
</html>
